name: Gate (all engines)

# L08 decision 11: pull requests run the gate in Chromium (ci.yml); this workflow runs Chromium,
# Firefox and WebKit, and React 18.3 (decision 9a: the lowest React the peer range admits).
#
# L10 decision 3 (ADR-0023): it runs for every release, called by release.yml, and by hand; never on
# a push (budget, Emil, 2026-10-28). Called with `release`, it is the release gate: the checks and
# tests too, the stale-run check as an error, a Storybook and a manifest built as the release, and
# the tarballs it gated, packed once and uploaded for the publish job.
on:
  workflow_call:
    inputs:
      release:
        description: Gate a release, and pack and upload what it gated.
        type: boolean
        default: false
      probe:
        description: "'fail' replaces the whole gate with one failing job (the release probe)."
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the calling workflow: a manual run never cancels a release, and nothing cancels a gate
# half-way.
concurrency:
  group: gate-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # L10 probe: the cheapest gate that fails, so release.yml's wiring can be shown to stop a publish
  # without spending a three-engine run (Emil, 2026-10-28).
  probe:
    if: inputs.probe == 'fail'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Release probe: this gate fails on purpose, and nothing after it may run."
          exit 1

  checks:
    if: inputs.release && inputs.probe == ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The container runs as root over a checkout it doesn't own: mark it safe for git (L09 docs).
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the API diff (decision 5) and the publish checks (decision 9).
      - run: pnpm check
      - run: pnpm test
      # Decision 6: at release, a stale manual run fails unless a pinned exception covers it.
      - run: node scripts/check-a11y-contracts.mjs --release

  gate:
    if: inputs.probe == ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
      SENUI_GATE_CONTAINER: '1'
      SENUI_GATE_BROWSERS: chromium,firefox,webkit
      # L09 decision 10: the gated pages are the published ones.
      SENUI_RELEASE: ${{ inputs.release && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter docs build-storybook
      - run: pnpm --filter docs exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-all-engines
          path: apps/docs/test-results/
          retention-days: 7
      # The site as released, deployed by release.yml only after a successful publish.
      - if: inputs.release
        run: test ! -e apps/docs/storybook-static/manifests
      - if: inputs.release
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/storybook-static

  react-18:
    # The packages publish `react: ^18.3 || ^19`, and the lockfile resolves 19. This job swaps in
    # 18.3 for the package's unit, ssr and browser projects, in all three engines. The lockfile
    # change stays on the runner. It proves runtime behaviour only: @types/react stays at 19, so the
    # type tests still check the .d.ts against React 19's types, not what an 18 consumer compiles
    # against.
    if: inputs.probe == ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
      SENUI_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v5
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @senakster/senui-tokens build
      - run: pnpm --filter @senakster/senui add -D react@18.3.1 react-dom@18.3.1
      # Fail loudly if the swap didn't take, rather than test 19 under an 18 label.
      - run: test "$(pnpm --filter @senakster/senui exec node -p "require('react-dom/package.json').version")" = 18.3.1
      # Each project also asserts, from inside its tests, that it rendered with this version.
      - run: pnpm --filter @senakster/senui test
        env:
          SENUI_EXPECT_REACT: 18.3.1

  # Decision 1: the gated build, packed once. The publish job publishes exactly these tarballs.
  pack:
    if: inputs.release && inputs.probe == ''
    needs: [checks, gate, react-18]
    runs-on: ubuntu-latest
    env:
      SENUI_RELEASE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter "./packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: tarballs/*.tgz
          retention-days: 30
