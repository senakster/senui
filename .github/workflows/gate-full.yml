name: Gate (all engines)

# L08 decision 11: pull requests run the gate in Chromium (ci.yml); every push to main runs Chromium,
# Firefox and WebKit, so an engine difference surfaces with the change that caused it, before a
# release. No scheduled run (Emil, 2026-10-27); start one by hand from the Actions tab.
# Decision 9a: the same runs test the package against the lowest React its peer range admits.
on:
  push:
    branches: [main]
    # Docs-only changes can't change a result (see ci.yml).
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
      SENUI_GATE_CONTAINER: '1'
      SENUI_GATE_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter docs build-storybook
      - run: pnpm --filter docs exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-all-engines
          path: apps/docs/test-results/
          retention-days: 7

  react-18:
    # The packages publish `react: ^18.3 || ^19`, and the lockfile resolves 19. This job swaps in
    # 18.3 for the package's unit, ssr and browser projects. The lockfile change stays on the runner.
    # It proves runtime behaviour only: @types/react stays at 19, so the type tests still check the
    # .d.ts against React 19's types, not what an 18 consumer compiles against.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @senakster/senui-tokens build
      - run: pnpm --filter @senakster/senui add -D react@18.3.1 react-dom@18.3.1
      # Fail loudly if the swap didn't take, rather than test 19 under an 18 label.
      - run: test "$(pnpm --filter @senakster/senui exec node -p "require('react-dom/package.json').version")" = 18.3.1
      # Each project also asserts, from inside its tests, that it rendered with this version.
      - run: pnpm --filter @senakster/senui test
        env:
          SENUI_EXPECT_REACT: 18.3.1
