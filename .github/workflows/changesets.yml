name: Changesets

# L10 decision 4: a pull request that changes what a package ships (its source or its `exports`)
# needs a changeset, or the `no-release` label, and every changeset is published text
# (scripts/check-changesets.mjs). A workflow of its own, so adding or removing the label re-runs
# only this job, not `verify`. Light: Node and git only, no install.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The Version packages pull request is opened by Actions, which starts no workflow; the release
  # job dispatches this one on its branch (L10 PR 5). Dispatched, only the text is checked.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      # A pull request checks out its merge commit. Its first parent is the base branch as it is
      # now (the event's own base sha can be stale on a label re-run), so the diff between the two
      # is exactly this pull request's change.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # setup-node v5 caches the `packageManager` (pnpm) by default and fails without it; this
          # job installs nothing, so there is nothing to cache.
          package-manager-cache: false
      # The label reaches the script through the environment, never interpolated into the command
      # (untrusted text never reaches a shell).
      - name: Check the changesets
        if: github.event_name == 'pull_request'
        env:
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: node scripts/check-changesets.mjs --require HEAD^1
      - name: Check the changesets' text
        if: github.event_name != 'pull_request'
        run: node scripts/check-changesets.mjs
