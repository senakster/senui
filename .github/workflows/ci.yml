name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The react package's browser test project (L03) runs in Chromium. The version comes from the
      # pinned playwright dev dependency; --with-deps adds the OS libraries it needs.
      - run: pnpm --filter @senakster/senui exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter docs build-storybook
      # L08: the a11y gate over the built Storybook, in Chromium (installed above, same Playwright
      # version). It moves into the pinned Playwright container with the screenshot baselines.
      - run: pnpm --filter docs exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: apps/docs/test-results/
          retention-days: 7
