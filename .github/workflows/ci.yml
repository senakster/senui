name: CI

# Docs-only changes (the repo's docs/, a top-level .md file, a changeset) can't change a test result
# or the site. On a pull request, `verify` must still report (it is a required check), so it runs and
# skips its heavy steps; on main they skip the workflow, since the pull request already checked their
# formatting. A .md file under packages/ or apps/ is code: the package README is the published
# USAGE.md (L09).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.changeset/**']
  # L10: the release workflow dispatches this on the Version packages branch, whose pull request,
  # opened by Actions, starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

# A newer pull-request run replaces an older one; on main every run finishes, so a deploy is never
# cancelled half-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheapest first (Emil, 2026-10-29): a changeset that breaks the published-text rules fails in
  # seconds, before the container job starts. Only the text: whether a pull request needs a
  # changeset depends on its labels, which `changesets.yml` re-checks without re-running this.
  # A skipped `verify` reads as passing to the ruleset, so a merge still waits on `changesets`,
  # which checks the same text.
  changeset-text:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `detect` finds the commit that set each version (needs history).
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/check-changesets.mjs
      # L10: a push that release.yml gates. Its gate runs `pnpm check`, `pnpm test` and the
      # Storybook gate in three engines, Chromium among them, and deploys the site built as the
      # release, so `verify` here would only repeat it (Emil, 2026-10-31).
      - id: release
        if: github.event_name == 'push'
        run: node scripts/release.mjs detect

  verify:
    needs: changeset-text
    if: github.event_name != 'push' || needs.changeset-text.outputs.release != 'true'
    runs-on: ubuntu-latest
    # L08: the pinned Playwright image (same version as the playwright dev dependencies) carries every
    # browser and its OS libraries, so nothing is installed per run, and the forced-colours
    # screenshot baselines are compared in the image they were generated in. Bump it with Playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
      SENUI_GATE_CONTAINER: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The container runs as root over a checkout it doesn't own, so git refuses it until it is
      # marked safe. The docs generator reads the commit and history (L09), on every event.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # `code` is false only when every changed file is docs. Anything else, or a push, runs it all.
      - id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|^[^/]+\.md$|^\.changeset/'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code == 'false'
        run: pnpm format:check
      - if: steps.changes.outputs.code != 'false'
        run: pnpm check
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test
      - if: steps.changes.outputs.code != 'false'
        run: pnpm --filter docs build-storybook
      # L08: the a11y gate over the built Storybook, in Chromium. The three-engine gate
      # (gate-full.yml) runs for every release and by hand, never per push (budget; ADR-0023).
      # Budget (Emil, 2026-10-28): 15 min, raised from 10 when the L09 docs pages took the step to
      # 13 min 56 s. A step over 15 min is reviewed; the timeout only stops a hang.
      - if: steps.changes.outputs.code != 'false'
        run: pnpm --filter docs exec playwright test
        timeout-minutes: 25
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: apps/docs/test-results/
          retention-days: 7
      # L09 decision 10: the site is the Storybook the gate just checked, from main only. It carries
      # senui's own manifest at its root, never Storybook's (that one is development-only).
      - if: github.event_name == 'push'
        run: test ! -e apps/docs/storybook-static/manifests
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/storybook-static

  deploy-storybook:
    # Never on a release push: `verify` is skipped then, and release.yml deploys the release's site.
    if: github.event_name == 'push' && needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and a later push waits rather than cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
