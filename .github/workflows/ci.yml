name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # L08: the pinned Playwright image (same version as the playwright dev dependencies) carries every
    # browser and its OS libraries, so nothing is installed per run, and the forced-colours
    # screenshot baselines are compared in the image they were generated in. Bump it with Playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      HOME: /root
      SENUI_GATE_CONTAINER: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter docs build-storybook
      # L08: the a11y gate over the built Storybook, in Chromium. main and nightly run all three
      # engines (gate-full.yml).
      - run: pnpm --filter docs exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: apps/docs/test-results/
          retention-days: 7
